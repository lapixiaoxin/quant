[project]
name = "qtrader"
version = "0.1.0"
description = "基于 akfamily（AKShare 数据 + AKQuant 引擎）的 A 股量化程序：数据/回测/实盘一套代码"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.19",
    "akquant>=0.3.65",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=15",
    "pydantic>=2",
    "pydantic-settings>=2",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
qtrader = "qtrader.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qtrader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
