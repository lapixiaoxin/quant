<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

</head>
<body class="module-page module-selection">
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="../../index.html">Quant Monitor</a>

      <nav class="site-nav" aria-label="全局导航">
        <a class="workspace-return" href="../../index.html">返回工作台</a>
      </nav>
    </div>
  </header>
  <main class="page control-page">
    <section class="control-heading">
      <span class="module-index">01</span>
      <h1>标的选择</h1>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>候选池</h2>
      </div>
<form class="catalog-filters" data-catalog-filters="selections">
        <label class="catalog-search">
          <span>搜索</span>
          <input data-field="text" type="search"
            placeholder="代码、名称、ID 或路径">
        </label>
<label>
          <span>期限</span>
          <select data-field="horizon">
            <option value="">全部</option>
            <option value="short">短期</option><option value="long">长期</option>
          </select>
        </label>
<label>
          <span>状态</span>
          <select data-field="status">
            <option value="">全部</option>
            <option value="completed">已完成</option><option value="screened">待深度研究</option><option value="running">运行中</option><option value="failed">失败</option><option value="pending">待验证</option>
          </select>
        </label>
        <button type="reset">重置</button>
        <output data-catalog-count="selections"></output>
      </form>
      <div class="table-wrap">
        <table class="management-table" data-catalog="selections">
          <thead><tr><th>候选池</th><th>期限</th><th>主题</th><th>创建</th><th>候选</th><th>初筛合格</th><th>状态</th></tr></thead>
          <tbody><tr data-catalog-row
          data-horizon="long"
          data-status="completed"
          data-theme="dividend-low-vol-monthly-income">
          <td><a href="../../research/selections/china-dividend-low-vol-monthly-etf/2026-08-16-selection.html"><strong>中国红利低波与月度分红 ETF</strong></a>
            <small>china-dividend-low-vol-monthly-etf</small></td>
          <td>长期</td>
          <td>dividend-low-vol-monthly-income</td>
          <td>2026-08-16</td>
          <td>10</td>
          <td>7</td>
          <td>
            <span class="status ok">
              已完成
            </span>
          </td>
        </tr></tbody>
        </table>
      </div>
    </section>

  </main>
  <script
    src="../../docs/assets/navigation.js?v=0.11.0"></script>
  <script src="../../docs/assets/catalog.js?v=0.11.0"></script>
