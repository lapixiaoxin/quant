<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>渠道与通知 · Quant Monitor</title>
  <link rel="stylesheet"
    href="../../docs/assets/docs.css?v=0.11.0">
</head>
<body class="module-page module-channels">
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="../../index.html">Quant Monitor</a>

      <nav class="site-nav" aria-label="全局导航">
        <a class="workspace-return" href="../../index.html">返回工作台</a>
      </nav>
    </div>
  </header>
  <main class="page control-page">
    <section class="control-heading">
      <span class="module-index">05</span>
      <h1>渠道与通知</h1>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>发送通道</h2>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>通道</th><th>类型</th><th>状态</th><th>职责</th></tr></thead>
          <tbody><tr data-catalog-row
          data-type="feishu"
          data-status="active">
          <td><strong>feishu_primary</strong></td>
          <td>飞书</td>
          <td>
            <span class="status ok">
              启用
            </span>
          </td>
          <td>飞书报告与远程命令</td>
        </tr></tbody>
        </table>
      </div>
    </section>
    <section class="section">
      <div class="section-head">
        <h2>通知策略</h2>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>策略</th><th>事件</th><th>通道</th><th>状态</th></tr></thead>
          <tbody><tr data-catalog-row data-status="active">
          <td><strong>daily_research</strong></td>
          <td>manual、base_report、agent_report、scheduled_report</td>
          <td>feishu_primary</td>
          <td>
            <span class="status ok">
              启用
            </span>
          </td>
        </tr><tr data-catalog-row data-status="retired">
          <td><strong>silent</strong></td>
          <td>无</td>
          <td>无</td>
          <td>
            <span class="status no">
              停用
            </span>
          </td>
        </tr></tbody>
        </table>
      </div>
    </section>

  </main>
  <script
    src="../../docs/assets/navigation.js?v=0.11.0"></script>
  <script src="../../docs/assets/catalog.js?v=0.11.0"></script>
</body>
</html>
